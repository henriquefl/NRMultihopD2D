[General]
debug-on-errors=false

##########################################################
#			Simulation parameters                        #
##########################################################
sim-time-limit=5s
warmup-period=5s
repeat = 3
**.routingRecorder.enabled = false

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = false

################ Mobility parameters #####################
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m

############### AMC MODULE PARAMETERS ###############
**.numBands = 50

################ PhyLayer & feedback parameters #####################

# HACK to speed up the simulation
# (sporadic CQI reporting, D2D multicast uses fixed modulations)
**.fbPeriod = 500tti

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")


# Config MultihopD2D
#
# UEs are deployed along a straight line and served by five gNodeBs.
# Each UE runs a MultihopD2D application that broadcasts event
# notifications via NR D2D multicast and relays received messages.
#
[Config MultihopD2D]
network = simu5g.simulations.NR.networks.MultiCell_D2DMultihop

############### Carrier Aggregation configuration #################
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = ${u=0}
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
*.carrierAggregation.componentCarrier[0].numBands = 50

*.gnb*.cellularNic.numCarriers = 1
*.gnb*.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.ue*[*].cellularNic.numCarriers = 1
*.ue*[*].cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.ue*[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

############### Transmission Power #####################
*.ue*[*].cellularNic.phy.ueTxPower = 26dBm
*.ue*[*].cellularNic.phy.d2dTxPower = 15dBm
*.ue*[*].cellularNic.nrPhy.d2dTxPower = 15dBm

# --- gNodeB configuration --- #
*.gnb*.mobility.initFromDisplayString = true

# --- UEs configuration --- #
*.numUe* = 10
*.ue1[*].macCellId = 0
*.ue1[*].masterId = 0
*.ue1[*].nrMacCellId = 1
*.ue1[*].nrMasterId = 1

#*.ue2[*].macCellId = 0
#*.ue2[*].masterId = 0
#*.ue2[*].nrMacCellId = 2
#*.ue2[*].nrMasterId = 2
#
#*.ue3[*].macCellId = 0
#*.ue3[*].masterId = 0
#*.ue3[*].nrMacCellId = 3
#*.ue3[*].nrMasterId = 3
#
#*.ue4[*].macCellId = 0
#*.ue4[*].masterId = 0
#*.ue4[*].nrMacCellId = 4
#*.ue4[*].nrMasterId = 4
#
#*.ue5[*].macCellId = 0
#*.ue5[*].masterId = 0
#*.ue5[*].nrMacCellId = 5
#*.ue5[*].nrMasterId = 5

*.ue*[*].mobility.initFromDisplayString = false
*.ue*[*].mobility.initialY = uniform(410m,420m)
*.ue1[*].mobility.initialX = uniform(0m,400m)
#*.ue2[*].mobility.initialX = uniform(400m,800m)
#*.ue3[*].mobility.initialX = uniform(800m,1200m)
#*.ue4[*].mobility.initialX = uniform(1200m,1600m)
#*.ue5[*].mobility.initialX = uniform(1600m,2000m)
*.ue*[*].mobility.typename = "LinearMobility"
*.ue*[*].mobility.speed = 0.1mps

# --- D2D configuration --- #
# Enable D2D for the gNodeB and the UEs involved in direct communications
*.gnb*.cellularNic.typename = "NRNicEnb"
*.ue*[*].cellularNic.typename = "NRNicUe"
*.ue*[*].cellularNic.d2dInitialMode = true
**.amcMode = "D2D"

**.usePreconfiguredTxParams = true
**.d2dCqi = 10

# --- X2 configuration --- #
# No X2 connections needed for the D2D multihop scenario
# (same as the LTE D2D multihop simulation)
*.gnb*.numX2Apps = 0

# ------------- Application Setup
*.ue*[*].numApps = 1
*.ue*[*].app[0].typename = "MultihopD2D"
*.ue*[*].app[0].destAddress = "224.0.0.10"     # address of the multicast group
*.ue*[*].app[0].ttl = 10
*.ue*[*].app[0].msgSize = 14B
*.ue*[*].app[0].maxBroadcastRadius = 1000m

# Point the MultihopD2D app to the NR MAC/PHY submodules so that
# it uses the NR node IDs (nrMacNodeId) for D2D multicast operations
*.ue*[*].app[0].lteMacModule = "^.cellularNic.nrMac"
*.ue*[*].app[0].ltePhyModule = "^.cellularNic.nrPhy"


# Config MultihopD2D-Trickle
#
# The application implements Trickle suppression mechanism
#
[Config MultihopD2D-Trickle]
extends=MultihopD2D

# ------------- Application Setup
*.ue*[*].app[0].trickle = true
*.ue*[*].app[0].k = 3
*.ue*[*].app[0].I = 0.01s


[Config MultihopD2D-rangeCheck]
extends=MultihopD2D

*.ue*[*].mobility.typename = "CircleMobility"

*.ue*[*].mobility.cy = uniform(410m,420m)
*.ue1[*].mobility.cx = uniform(0m,400m)
#*.ue2[*].mobility.cx = uniform(400m,800m)
#*.ue3[*].mobility.cx = uniform(800m,1200m)
#*.ue4[*].mobility.cx = uniform(1200m,1600m)
#*.ue5[*].mobility.cx = uniform(1600m,2000m)

*.ue*[*].mobility.r = 1m
*.ue*[*].mobility.speed = 1 mps

**.cellularNic.channelModel[0].fading = ${fading = false , true }
**.cellularNic.channelModel[0].shadowing = ${shadowing = false , true }
**.cellularNic.nrChannelModel[0].fading = ${fading}
**.cellularNic.nrChannelModel[0].shadowing = ${shadowing}

output-scalar-file = ${resultdir}/${configname}/${iterationvars}-${repetition}-${runid}.sca
output-vector-file = ${resultdir}/${configname}/${iterationvars}-${repetition}-${runid}.vec

# D2D multicast goes through nrPhy, so range check parameters must be set there
**.nrPhy.enableMulticastD2DRangeCheck = ${rangeCheck = true, false}
**.nrPhy.multicastD2DRange = ${range = 500m , 800m, 1000m, 1500m }

constraint = ($rangeCheck == true) || ( ($rangeCheck == false) && ($range == 800m) )


[Config MultihopD2D-rangeCheckTrickle]
extends=MultihopD2D-rangeCheck

# ------------- Application Setup
*.ue*[*].app[0].trickle = true
*.ue*[*].app[0].k = 3
*.ue*[*].app[0].I = 0.01s
